<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CareSync | Log In</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f5f5;
    color: #000;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    position: relative; overflow: hidden;
  }
  /* background blobs */
  body::before, body::after {
    content: ""; position: fixed; z-index: 0; border-radius: 50%;
    background: linear-gradient(180deg, #ffffff 0%, #c9fde9 50%, #b6fbe2 100%);
    box-shadow: 0 10px 30px rgba(0,0,0,0.10);
  }
  body::before { width: 620px; height: 620px; top: -300px; right: -160px; }
  body::after  { width: 560px; height: 560px; bottom: -300px; left: -180px; }

  .wrap {
    position: relative; z-index: 1;
    display: flex;
    width: 100%; max-width: 920px; min-height: 500px;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 14px 40px rgba(0,0,0,0.18);
    overflow: hidden;
  }
  .form-side {
    flex: 1; padding: 56px 52px;
    display: flex; flex-direction: column; justify-content: center;
    background: #f9f9f9;
  }
  .promo-side {
    flex: 1; padding: 40px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    background: linear-gradient(180deg, #ffffff 0%, #c9fde9 60%, #b6fbe2 100%);
  }
  .promo-side h1 { font-size: 46px; line-height: 1.15; }
  .promo-side p { margin-top: 16px; font-size: 18px; }

  .form-side h2 { font-size: 32px; color: #0f9d8a; }
  .form-side .lead { margin-top: 6px; font-size: 14px; color: #555; margin-bottom: 28px; }

  .field { position: relative; margin-top: 22px; }
  .field svg { position: absolute; left: 0; top: 12px; width: 20px; height: 20px; stroke: #0f9d8a; fill: none; stroke-width: 1.8; }
  .field input {
    width: 100%; padding: 12px 6px 10px 32px;
    border: none; border-bottom: 2px solid #0f9d8a;
    background: transparent; font-size: 15px; outline: none;
  }
  .field input::placeholder { color: #999; }
  .field input:focus { border-bottom-color: #0c8575; box-shadow: 0 2px 0 0 #0c8575; }

  .row { display: flex; align-items: center; justify-content: space-between; margin-top: 28px; gap: 16px; }
  .row a { color: #0f9d8a; font-size: 13px; text-decoration: none; }
  .row a:hover { text-decoration: underline; }
  button.primary {
    flex: 1; max-width: 190px; padding: 12px;
    background: #0f9d8a; color: #fff; border: none; border-radius: 6px;
    font-size: 16px; font-weight: bold; cursor: pointer;
    transition: background .2s, transform .1s;
  }
  button.primary:hover { background: #0c8575; }
  button.primary:active { transform: scale(0.98); }
  .error { color: #c0392b; font-size: 13px; margin-top: 14px; min-height: 16px; }
  .switch { text-align: center; margin-top: 18px; font-size: 14px; }
  .switch a { color: #0f9d8a; font-weight: bold; text-decoration: none; }
  .switch a:hover { text-decoration: underline; }

  @media (max-width: 760px) {
    .wrap { flex-direction: column-reverse; }
    .form-side { padding: 36px 28px; }
    .promo-side { padding: 36px 20px; }
    .promo-side h1 { font-size: 32px; }
    .promo-side p { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="wrap">
  <!-- LEFT: form -->
  <section class="form-side">
    <h2>Log in to CareSync.</h2>
    <p class="lead">Enter your details below.</p>

    <form id="loginForm" novalidate>
      <div class="field">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
        <input type="text" id="email" placeholder="Email" autocomplete="email">
      </div>
      <div class="field">
        <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
        <input type="password" id="password" placeholder="Password" autocomplete="current-password">
      </div>

      <div class="error" id="error"></div>

      <div class="row">
        <button type="submit" class="primary">Log In</button>
      </div>
    </form>

    <p class="switch">Don't have an account? <a href="signup.html">Create new account</a></p>
  </section>

  <!-- RIGHT: promo -->
  <section class="promo-side">
    <h1>Get Checked.<br>Stay Healthy.</h1>
    <p>Friendly care for you and your family, right in your community.</p>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script>
  const db = supabase.createClient('https://njgozrsxoaepylosccup.supabase.co', 'sb_publishable_UrExMosH6ieQZ0K1omjGaA_eYRi7dmz');
  const ADMIN_PAGE = 'admin.html';
  const USER_PAGE = 'caresync.html';

  const form = document.getElementById('loginForm');
  const emailInput = document.getElementById('email');
  const passInput = document.getElementById('password');
  const error = document.getElementById('error');
  const btn = form.querySelector('button.primary');

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    const email = emailInput.value.trim();
    const pass = passInput.value;

    if (!email || !pass) {
      error.textContent = 'Please enter your email and password.';
      return;
    }
    if (!/^\S+@\S+\.\S+$/.test(email)) {
      error.textContent = 'Please enter a valid email address.';
      return;
    }

    error.textContent = '';
    btn.disabled = true; btn.textContent = 'Logging in...';

    const { data, error: err } = await db.auth.signInWithPassword({ email, password: pass });

    if (err) {
      btn.disabled = false; btn.textContent = 'Log In';
      error.textContent = err.message === 'Email not confirmed'
        ? 'Please confirm your email first, then log in.'
        : 'Incorrect email or password.';
      return;
    }

    const { data: profile, error: pErr } = await db.from('profiles')
      .select('role').eq('id', data.user.id).single();

    if (pErr) {
      btn.disabled = false; btn.textContent = 'Log In';
      error.textContent = 'Could not load your profile. Please try again.';
      return;
    }

    window.location.href = profile && profile.role === 'admin' ? ADMIN_PAGE : USER_PAGE;
  });

  [emailInput, passInput].forEach(input => {
    input.addEventListener('input', () => { error.textContent = ''; error.style.color = ''; });
  });

  document.querySelector('.row a').addEventListener('click', async function (e) {
    e.preventDefault();
    const email = emailInput.value.trim();
    if (!/^\S+@\S+\.\S+$/.test(email)) { error.textContent = 'Enter your email above first, then click Forgot password.'; return; }
    const { error: err } = await db.auth.resetPasswordForEmail(email);
    error.style.color = err ? '' : '#0f9d8a';
    error.textContent = err ? err.message : 'Password reset email sent. Check your inbox.';
  });
</script>
</body>
</html>
