<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CareSync | Sign Up</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f5f5;
    color: #000;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    position: relative; overflow: hidden;
  }
  /* background blobs */
  body::before, body::after {
    content: ""; position: fixed; z-index: 0; border-radius: 50%;
    background: linear-gradient(180deg, #ffffff 0%, #c9fde9 50%, #b6fbe2 100%);
    box-shadow: 0 10px 30px rgba(0,0,0,0.10);
  }
  body::before { width: 620px; height: 620px; top: -300px; left: -160px; }
  body::after  { width: 560px; height: 560px; bottom: -300px; right: -180px; }

  .wrap {
    position: relative; z-index: 1;
    display: flex;
    width: 100%; max-width: 920px; min-height: 560px;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 14px 40px rgba(0,0,0,0.18);
    overflow: hidden;
  }
  .form-side {
    flex: 1; padding: 48px 52px;
    display: flex; flex-direction: column; justify-content: center;
    background: #f9f9f9;
  }
  .promo-side {
    flex: 1; padding: 40px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    background: linear-gradient(180deg, #ffffff 0%, #c9fde9 60%, #b6fbe2 100%);
  }
  .promo-side h1 { font-size: 46px; line-height: 1.15; }
  .promo-side p { margin-top: 16px; font-size: 18px; }

  .form-side h2 { font-size: 32px; color: #0f9d8a; }
  .form-side .lead { margin-top: 6px; font-size: 14px; color: #555; margin-bottom: 14px; }

  .field { position: relative; margin-top: 20px; }
  .field svg { position: absolute; left: 0; top: 12px; width: 20px; height: 20px; stroke: #0f9d8a; fill: none; stroke-width: 1.8; }
  .field input {
    width: 100%; padding: 12px 6px 10px 32px;
    border: none; border-bottom: 2px solid #0f9d8a;
    background: transparent; font-size: 15px; outline: none;
  }
  .field input::placeholder { color: #999; }
  .field input:focus { border-bottom-color: #0c8575; box-shadow: 0 2px 0 0 #0c8575; }

  button.primary {
    width: 100%; margin-top: 8px; padding: 13px;
    background: #0f9d8a; color: #fff; border: none; border-radius: 6px;
    font-size: 16px; font-weight: bold; cursor: pointer;
    transition: background .2s, transform .1s;
  }
  button.primary:hover { background: #0c8575; }
  button.primary:active { transform: scale(0.98); }
  .error { color: #c0392b; font-size: 13px; margin-top: 14px; min-height: 16px; }
  .switch { text-align: center; margin-top: 18px; font-size: 14px; }
  .switch a { color: #0f9d8a; font-weight: bold; text-decoration: none; }
  .switch a:hover { text-decoration: underline; }

  @media (max-width: 760px) {
    .wrap { flex-direction: column; }
    .form-side { padding: 36px 28px; }
    .promo-side { padding: 36px 20px; }
    .promo-side h1 { font-size: 32px; }
    .promo-side p { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="wrap">
  <!-- LEFT: promo -->
  <section class="promo-side">
    <h1>Get Checked.<br>Stay Healthy.</h1>
    <p>Friendly care for you and your family, right in your community.</p>
  </section>

  <!-- RIGHT: form -->
  <section class="form-side">
    <h2>Sign up to CareSync.</h2>
    <p class="lead">Create your account below.</p>

    <form id="signupForm" novalidate>
      <div class="field">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
        <input type="text" id="name" placeholder="Full name" required>
      </div>
      <div class="field">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
        <input type="email" id="email" placeholder="Email" required>
      </div>
      <div class="field">
        <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
        <input type="password" id="password" placeholder="Password (min. 6 characters)" required>
      </div>
      <div class="field">
        <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
        <input type="password" id="confirm" placeholder="Confirm password" required>
      </div>

      <div class="error" id="error"></div>

      <button type="submit" class="primary">Sign Up</button>
    </form>

    <p class="switch">Already have an account? <a href="login.html">Log in</a></p>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script>
  const db = supabase.createClient('https://njgozrsxoaepylosccup.supabase.co', 'sb_publishable_UrExMosH6ieQZ0K1omjGaA_eYRi7dmz');

  document.getElementById('signupForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const pass = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;
    const error = document.getElementById('error');
    const btn = document.querySelector('button.primary');

    if (!name || !email || !pass || !confirm) { error.textContent = 'Please fill in all fields.'; return; }
    if (!/^\S+@\S+\.\S+$/.test(email)) { error.textContent = 'Please enter a valid email address.'; return; }
    if (pass.length < 6) { error.textContent = 'Password must be at least 6 characters.'; return; }
    if (pass !== confirm) { error.textContent = 'Passwords do not match.'; return; }

    error.textContent = '';
    btn.disabled = true; btn.textContent = 'Creating account...';

    const { data, error: err } = await db.auth.signUp({
      email,
      password: pass,
      options: {
        data: { full_name: name },
        emailRedirectTo: new URL('login.html', window.location.href).href
      }
    });

    btn.disabled = false; btn.textContent = 'Sign Up';
    error.style.color = '';

    if (err) {
      const m = (err.message || '').toLowerCase();
      if (err.code === 'over_email_send_rate_limit' || m.includes('rate limit')) {
        error.textContent = 'Too many emails sent. Please wait a few minutes and try again.';
      } else if (err.code === 'user_already_exists' || m.includes('already registered')) {
        error.textContent = 'This email is already registered. Please log in instead.';
      } else if (err.code === 'weak_password') {
        error.textContent = 'That password is too weak. Try a longer one.';
      } else {
        error.textContent = err.message;
      }
      return;
    }

    // Supabase hides duplicate emails: it returns "success" with an empty identities list
    // and sends no email. Detect that here so the user is not misled.
    if (data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) {
      error.textContent = 'This email is already registered. Please log in, or use "Forgot password".';
      return;
    }

    // Email confirmation turned off in Supabase: the user is already signed in.
    if (data.session) {
      window.location.href = 'caresync.html';
      return;
    }

    // Email confirmation on: tell the user to check their inbox.
    error.style.color = '#0f9d8a';
    error.textContent = 'Account created! Check your email (and spam folder) to confirm, then log in.';
    btn.disabled = true;
    setTimeout(() => { window.location.href = 'login.html'; }, 5000);
  });
  ['name', 'email', 'password', 'confirm'].forEach(id => {
    document.getElementById(id).addEventListener('input', () => {
      const e = document.getElementById('error'); e.textContent = ''; e.style.color = '';
    });
  });
</script>
</body>
</html>
